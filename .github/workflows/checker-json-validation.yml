name: Checker JSON candidate validation
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_SHA: 609e6d8782c02de6c4a4e49592f041210fb99f50
      BASE_SHA: ce9415e9651117b7335d3b32d73d38b4eb1e3219
    steps:
    - uses: actions/checkout@v4
      with:
        ref: 609e6d8782c02de6c4a4e49592f041210fb99f50
        fetch-depth: 0
        persist-credentials: false
    - name: Verify source and validation tree identity
      shell: bash
      run: 'set -euo pipefail

        export EVIDENCE_DIR="$RUNNER_TEMP/checker-json-evidence"

        echo "EVIDENCE_DIR=$EVIDENCE_DIR" >> "$GITHUB_ENV"

        mkdir -p "$EVIDENCE_DIR"

        test "$(git rev-parse HEAD)" = "$APP_SHA"

        test "$(git rev-parse ''${{ github.sha }}^'')" = "$APP_SHA"

        test "$(git diff --name-only "$APP_SHA" ''${{ github.sha }}'')" = ''.github/workflows/checker-json-validation.yml''

        git diff "$APP_SHA" ''${{ github.sha }}'' -- . '':!.github/workflows/checker-json-validation.yml''
        > "$EVIDENCE_DIR/validation-tree.diff"

        test ! -s "$EVIDENCE_DIR/validation-tree.diff"

        sha256sum python/src/open_ontologies_lite/horn/certify.py python/tests/test_horn_checker_json.py
        Cargo.lock > "$EVIDENCE_DIR/application.sha256"

        '
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Verify exact native-input equivalence to completed lane
      shell: bash
      run: "set -euo pipefail\npython - <<'PYCODE'\nimport subprocess, pathlib, os,\
        \ hashlib, json\nprior = '00042ff6210facd9f57368ab4a2da043c95ddef9'\napp =\
        \ os.environ['APP_SHA']\ndef inputs(ref):\n    records = subprocess.check_output(['git',\
        \ 'ls-tree', '-rz', ref]).split(b'\\0')\n    return [record for record in\
        \ records if record and not record.split(b'\\t',1)[1].startswith(b'python/')\
        \ and record.split(b'\\t',1)[1] != b'CHANGELOG.md']\na, b = inputs(prior),\
        \ inputs(app)\nassert a == b, 'Non-Python tree differs from prior completed\
        \ native validation'\np = pathlib.Path(os.environ['EVIDENCE_DIR'])\n(p / 'native-input-identity.json').write_text(json.dumps({'application':\
        \ app, 'prior_validated_application': prior, 'prior_run': 'https://github.com/rudycelekli/open-ontologies/actions/runs/38097956427',\
        \ 'non_python_records': len(a), 'manifest_sha256': hashlib.sha256(b'\\0'.join(a)).hexdigest(),\
        \ 'equal': True, 'claim': 'Reuse prior native gate evidence for identical\
        \ non-Python inputs; no native Rust job ran on this application commit.'},\
        \ indent=2)+'\\n')\nPYCODE\n"
    - name: Install actual Python package and dev tools
      shell: bash
      run: 'set -euo pipefail

        python -m pip install --only-binary=pyoxigraph -e ''python[dev]'' pyoxigraph==0.5.11
        pytest==9.1.1 build==1.6.1

        python --version

        python -m pip freeze > "$EVIDENCE_DIR/python-versions.log"

        '
    - name: Original checker must fail malformed transport responses
      shell: bash
      run: "set -euo pipefail\ntrap 'git show \"$APP_SHA:python/src/open_ontologies_lite/horn/certify.py\"\
        \ > python/src/open_ontologies_lite/horn/certify.py' EXIT\ngit show \"$BASE_SHA:python/src/open_ontologies_lite/horn/certify.py\"\
        \ > python/src/open_ontologies_lite/horn/certify.py\nset +e\npython -m pytest\
        \ -v python/tests/test_horn_checker_json.py --junitxml=\"$EVIDENCE_DIR/baseline.xml\"\
        \ > \"$EVIDENCE_DIR/baseline.log\" 2>&1\ncode=$?\nset -e\ncat \"$EVIDENCE_DIR/baseline.log\"\
        \ntest \"$code\" = 1\npython - <<'PYCODE'\nimport json, os, pathlib, xml.etree.ElementTree\
        \ as ET\np = pathlib.Path(os.environ['EVIDENCE_DIR'])\ncases = list(ET.parse(p\
        \ / 'baseline.xml').iter('testcase'))\ninvalid = {f'test_non_object_checker_json_is_unchecked[{code}-{kind}]'\
        \ for code in ['exit-zero', 'exit-one'] for kind in ['array', 'null', 'boolean',\
        \ 'number', 'string']}\ncontrols = {f'test_existing_checker_outcomes_are_preserved[{kind}]'\
        \ for kind in ['malformed-json', 'missing-fields', 'rejection', 'unexpected-exit',\
        \ 'unreadable']}\nassert len(cases) == 15 and {c.attrib['name'] for c in cases}\
        \ == invalid | controls\nfor case in cases:\n    assert case.find('error')\
        \ is None and case.find('skipped') is None\n    failures = case.findall('failure')\n\
        \    assert len(failures) == int(case.attrib['name'] in invalid)\n    if failures:\
        \ assert 'AttributeError' in (failures[0].text or ''), failures[0].text\n\
        (p / 'baseline-classifier.json').write_text(json.dumps({'failed': sorted(invalid),\
        \ 'passed': sorted(controls), 'errors': 0, 'skips': 0, 'failure': 'AttributeError'},\
        \ indent=2)+'\\n')\nPYCODE\n"
    - name: Restore exact application source
      if: always()
      shell: bash
      run: 'set -euo pipefail

        git show "$APP_SHA:python/src/open_ontologies_lite/horn/certify.py" > python/src/open_ontologies_lite/horn/certify.py

        sha256sum --check "$EVIDENCE_DIR/application.sha256"

        git diff --exit-code

        '
    - name: Fixed checker and entire Python core suite
      shell: bash
      run: 'set -euo pipefail

        python -m pytest -v -rs python/tests/test_horn_checker_json.py 2>&1 | tee
        "$EVIDENCE_DIR/fixed.log"

        python -m pytest -v -rs python/tests --ignore=python/tests/test_align.py --ignore=python/tests/test_shacl.py
        --ignore=python/tests/test_shacl_vacuous.py 2>&1 | tee "$EVIDENCE_DIR/python-core.log"

        '
    - name: Build and consume package wheel
      shell: bash
      run: "set -euo pipefail\npython -m build --wheel --outdir \"$EVIDENCE_DIR/dist\"\
        \ python 2>&1 | tee \"$EVIDENCE_DIR/wheel-build.log\"\npython -m pip install\
        \ --force-reinstall --no-deps \"$EVIDENCE_DIR\"/dist/*.whl\npython -I - <<'PYCODE'\
        \ 2>&1 | tee \"$EVIDENCE_DIR/wheel-smoke.log\"\nimport open_ontologies_lite,\
        \ pathlib, tempfile, os, sys\nfrom open_ontologies_lite.horn.certify import\
        \ check_horn\nassert '/site-packages/' in open_ontologies_lite.__file__, open_ontologies_lite.__file__\n\
        with tempfile.TemporaryDirectory() as temporary:\n    root = pathlib.Path(temporary)\n\
        \    (root / 'check').write_text('print(\"[]\")\\n')\n    previous = pathlib.Path.cwd()\n\
        \    try:\n        os.chdir(root)\n        report = check_horn(root, checker=sys.executable)\n\
        \        assert report['status'] == 'unchecked_error' and report['checked']\
        \ is False and report['verdict'] is None, report\n    finally:\n        os.chdir(previous)\n\
        print('Installed wheel non-object JSON subprocess handling passed; no Lean\
        \ proof claim')\nPYCODE\n"
    - name: Final source identity
      shell: bash
      run: 'set -euo pipefail

        sha256sum --check "$EVIDENCE_DIR/application.sha256"

        git diff --exit-code

        '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: checker-json-validation
        retention-days: 3
        path: ${{ runner.temp }}/checker-json-evidence/
'on':
  push:
    branches:
    - validation/checker-json-20261010
